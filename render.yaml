# Render Blueprint — Training Wallet backend. GENERATED by infra/render/generate-blueprint.mjs;
# edit that script, not this file. Setup guide: docs/09-deployment.md.
#
# Region: Frankfurt (EU data residency, D26). One project, two environments that share nothing.
# Per environment: the API (web service, also serves Socket.IO), the worker (outbox, pushes,
# reminders, payment sweeper, reconciliation), PostgreSQL 17 with point-in-time recovery, and
# Key Value (Redis) for shared rate limits. API and worker run the same Docker image.
# Secrets are "sync: false": Render asks for each one when the Blueprint is first created.
# Never write a secret value into this file.

projects:
  - name: training-wallet
    environments:
      # ────────────────────────────── staging ──────────────────────────────
      # auto-deploys `main` once CI has passed; used with the TestFlight "preview" build
      - name: staging
        envVarGroups:
          - name: tw-staging-config
            envVars:
              - key: NODE_ENV
                value: 'staging'
              - key: LOG_LEVEL
                value: 'info'
              - key: TRUST_PROXY_HOPS
                value: '1'
              - key: APNS_ENVIRONMENT
                value: 'production'
              - key: APNS_BUNDLE_ID
                value: 'com.trainingwallet.app.staging'
              - key: APP_LINK_BASE
                value: 'trainingwallet-staging://'
              - key: S3_REGION
                value: 'auto'
              - key: S3_FORCE_PATH_STYLE
                value: 'true'
        databases:
          - name: tw-db-staging
            region: frankfurt
            postgresMajorVersion: '17'
            plan: 0.1c-256mb # paid plan: daily backups + point-in-time recovery
            databaseName: training_wallet
            user: training_wallet
            ipAllowList: [] # internal connections only
        services:
          - type: keyvalue
            name: tw-redis-staging
            region: frankfurt
            plan: free
            ipAllowList: [] # internal connections only
            maxmemoryPolicy: noeviction
          - type: web
            name: tw-api-staging
            runtime: docker
            region: frankfurt
            plan: 0.5c-512mb
            dockerfilePath: ./apps/api/Dockerfile
            dockerContext: .
            healthCheckPath: /health/ready
            # Migrations run once per deploy, before new instances take traffic.
            preDeployCommand: node_modules/.bin/prisma migrate deploy
            branch: main
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - 'apps/api/**'
                - 'packages/**'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'package.json'
            envVars:
              - fromGroup: tw-staging-config
              - key: DATABASE_URL
                fromDatabase:
                  name: tw-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: tw-redis-staging
                  property: connectionString
              - key: JWT_PRIVATE_KEY
                sync: false
              - key: SMTP_URL
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: S3_ENDPOINT
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_PUBLISHABLE_KEY
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              - key: APNS_KEY_ID
                sync: false
              - key: APNS_TEAM_ID
                sync: false
              - key: APNS_PRIVATE_KEY
                sync: false
              - key: SENTRY_DSN
                sync: false
          - type: worker
            name: tw-worker-staging
            runtime: docker
            region: frankfurt
            plan: 0.5c-512mb
            dockerfilePath: ./apps/api/Dockerfile
            dockerContext: .
            dockerCommand: node --enable-source-maps dist/worker.js
            branch: main
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - 'apps/api/**'
                - 'packages/**'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'package.json'
            envVars:
              - fromGroup: tw-staging-config
              - key: DATABASE_URL
                fromDatabase:
                  name: tw-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: tw-redis-staging
                  property: connectionString
              - key: JWT_PRIVATE_KEY
                sync: false
              - key: SMTP_URL
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: S3_ENDPOINT
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_PUBLISHABLE_KEY
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              - key: APNS_KEY_ID
                sync: false
              - key: APNS_TEAM_ID
                sync: false
              - key: APNS_PRIVATE_KEY
                sync: false
              - key: SENTRY_DSN
                sync: false

      # ────────────────────────────── production ──────────────────────────────
      # deployed only by .github/workflows/release.yml (manual approval, deploy hook)
      - name: production
        # Destructive actions (deleting the database or services) need extra confirmation.
        permissions:
          protection: enabled
        envVarGroups:
          - name: tw-production-config
            envVars:
              - key: NODE_ENV
                value: 'production'
              - key: LOG_LEVEL
                value: 'info'
              - key: TRUST_PROXY_HOPS
                value: '1'
              - key: APNS_ENVIRONMENT
                value: 'production'
              - key: APNS_BUNDLE_ID
                value: 'com.trainingwallet.app'
              - key: APP_LINK_BASE
                value: 'trainingwallet://'
              - key: S3_REGION
                value: 'auto'
              - key: S3_FORCE_PATH_STYLE
                value: 'true'
        databases:
          - name: tw-db-production
            region: frankfurt
            postgresMajorVersion: '17'
            plan: 0.5c-1g # paid plan: daily backups + point-in-time recovery
            diskSizeGB: 15
            storageAutoscalingEnabled: true
            databaseName: training_wallet
            user: training_wallet
            ipAllowList: [] # internal connections only
        services:
          - type: keyvalue
            name: tw-redis-production
            region: frankfurt
            plan: 256mb
            ipAllowList: [] # internal connections only
            maxmemoryPolicy: noeviction
          - type: web
            name: tw-api-production
            runtime: docker
            region: frankfurt
            plan: 1c-2g
            numInstances: 2 # rolling deploys without downtime
            dockerfilePath: ./apps/api/Dockerfile
            dockerContext: .
            healthCheckPath: /health/ready
            # Migrations run once per deploy, before new instances take traffic.
            preDeployCommand: node_modules/.bin/prisma migrate deploy
            branch: main
            autoDeployTrigger: off
            buildFilter:
              paths:
                - 'apps/api/**'
                - 'packages/**'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'package.json'
            envVars:
              - fromGroup: tw-production-config
              - key: DATABASE_URL
                fromDatabase:
                  name: tw-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: tw-redis-production
                  property: connectionString
              - key: JWT_PRIVATE_KEY
                sync: false
              - key: SMTP_URL
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: S3_ENDPOINT
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_PUBLISHABLE_KEY
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              - key: APNS_KEY_ID
                sync: false
              - key: APNS_TEAM_ID
                sync: false
              - key: APNS_PRIVATE_KEY
                sync: false
              - key: SENTRY_DSN
                sync: false
          - type: worker
            name: tw-worker-production
            runtime: docker
            region: frankfurt
            plan: 0.5c-512mb
            dockerfilePath: ./apps/api/Dockerfile
            dockerContext: .
            dockerCommand: node --enable-source-maps dist/worker.js
            branch: main
            autoDeployTrigger: off
            buildFilter:
              paths:
                - 'apps/api/**'
                - 'packages/**'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'package.json'
            envVars:
              - fromGroup: tw-production-config
              - key: DATABASE_URL
                fromDatabase:
                  name: tw-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: tw-redis-production
                  property: connectionString
              - key: JWT_PRIVATE_KEY
                sync: false
              - key: SMTP_URL
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: S3_ENDPOINT
                sync: false
              - key: S3_BUCKET
                sync: false
              - key: S3_ACCESS_KEY_ID
                sync: false
              - key: S3_SECRET_ACCESS_KEY
                sync: false
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_PUBLISHABLE_KEY
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              - key: APNS_KEY_ID
                sync: false
              - key: APNS_TEAM_ID
                sync: false
              - key: APNS_PRIVATE_KEY
                sync: false
              - key: SENTRY_DSN
                sync: false
