name: Staging smoke test

# Render deploys `main` to staging by itself once CI has passed (autoDeployTrigger: checksPass).
# This workflow then waits until staging reports the new commit and runs the read-only smoke
# test against it. Set the repository variable STAGING_API_URL (e.g. https://tw-api-staging.onrender.com).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success' && vars.STAGING_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Wait for the new commit on staging, then smoke test
        run: node scripts/smoke-test.mjs "${{ vars.STAGING_API_URL }}" "${{ github.event.workflow_run.head_sha }}" --wait 1200
