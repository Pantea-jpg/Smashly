name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the full CI on the tagged commit before deploying production.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, i18n, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Shadow database for the migration drift check (integration tests use Testcontainers).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d shadow" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: i18n key parity (en ⇄ nl)
        run: pnpm i18n:check

      # Unit tests everywhere, plus API integration tests against a throwaway PostgreSQL 17
      # started by Testcontainers (Docker is available on ubuntu-latest runners).
      - name: Tests (unit + Postgres integration)
        run: pnpm test

      - name: Migrations match the Prisma schema (no drift)
        working-directory: apps/api
        env:
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
        run: |
          out=$(pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script)
          echo "$out"
          echo "$out" | grep -q "This is an empty migration" || { echo "::error::schema.prisma has changes without a migration"; exit 1; }

      - name: OpenAPI document is up to date
        run: |
          pnpm --filter @tw/api openapi:generate
          git diff --exit-code apps/api/openapi.json || { echo "::error::Run pnpm --filter @tw/api openapi:generate and commit the result"; exit 1; }

      - name: Build API bundle
        run: pnpm --filter @tw/api build

  security:
    name: Secrets scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit

      # Fails on committed keys, tokens and passwords (Phase 9 recommendation, docs/06).
      # Free for personal accounts; a GitHub organization needs a GITLEAKS_LICENSE secret.
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Production dependencies must have no high or critical advisories (release gate).
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level high

  image:
    name: Production image builds and migrates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: release_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d release_check" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the image Render deploys
        run: docker build -f apps/api/Dockerfile -t tw-api:ci .

      # The same command Render runs as preDeployCommand, against an empty database.
      - name: Migrations apply inside the image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql://ci:ci@localhost:5432/release_check
          tw-api:ci node_modules/.bin/prisma migrate deploy
