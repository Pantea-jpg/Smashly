packages:
  - apps/*
  - packages/*

# React Native / Metro expect a flat node_modules layout. Expo supports isolated installs,
# but hoisted avoids native-module resolution issues (Expo monorepo guide).
nodeLinker: hoisted

# pnpm 10 blocks dependency install scripts unless allow-listed.
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

ignoredBuiltDependencies:
  - '@parcel/watcher'

# Security pins for transitive dependencies (Phase 9 dependency audit, see docs/security/).
overrides:
  # GHSA-7589-6fvf-x4pw (high): ReDoS in effect <=3.22.0, pulled in by @prisma/config.
  'effect@<3.22.1': 3.22.5
