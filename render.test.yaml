# Render Blueprint — Training Wallet LOW-COST TEST setup. GENERATED by
# infra/render/generate-blueprint.mjs; edit that script, not this file. Guide: docs/13-testing.md.
# No Stripe, email provider, storage or Sentry needed: online top-ups and profile pictures are
# unavailable, and emails (verification, password reset) are written to the worker's log.
# Only JWT_PRIVATE_KEY is asked for. Never use this setup for real members.

projects:
  - name: training-wallet-test
    environments:
      # ────────────────────────────── test ──────────────────────────────
      # test only: free database, Redis and API; deploys every push to main
      - name: test
        envVarGroups:
          - name: tw-test-config
            envVars:
              - key: NODE_ENV
                value: 'staging'
              - key: LOG_LEVEL
                value: 'info'
              - key: TRUST_PROXY_HOPS
                value: '1'
              - key: APNS_ENVIRONMENT
                value: 'production'
              - key: APNS_BUNDLE_ID
                value: 'com.trainingwallet.app'
              - key: APP_LINK_BASE
                value: 'trainingwallet://'
              - key: S3_REGION
                value: 'auto'
              - key: S3_FORCE_PATH_STYLE
                value: 'true'
              - key: ENABLE_API_DOCS
                value: 'true'
              - key: SMTP_URL
                value: 'log://'
              - key: EMAIL_FROM
                value: 'Training Wallet <no-reply@example.test>'
              - key: S3_BUCKET
                value: 'tw-test-no-storage'
        databases:
          - name: tw-db-test
            region: frankfurt
            postgresMajorVersion: '17'
            plan: free # no backups; expires after 30 days (test only)
            databaseName: training_wallet
            user: training_wallet
            ipAllowList: [] # internal connections only
        services:
          - type: keyvalue
            name: tw-redis-test
            region: frankfurt
            plan: free
            ipAllowList: [] # internal connections only
            maxmemoryPolicy: noeviction
          - type: web
            name: tw-api-test
            runtime: docker
            region: frankfurt
            plan: free
            dockerfilePath: ./apps/api/Dockerfile
            dockerContext: .
            healthCheckPath: /health/ready
            # Free plan has no pre-deploy step: migrations run when the container starts.
            dockerCommand: sh -c "node_modules/.bin/prisma migrate deploy && exec node --enable-source-maps dist/main.js"
            branch: main
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - 'apps/api/**'
                - 'packages/**'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'package.json'
            envVars:
              - fromGroup: tw-test-config
              - key: DATABASE_URL
                fromDatabase:
                  name: tw-db-test
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: tw-redis-test
                  property: connectionString
              - key: JWT_PRIVATE_KEY
                sync: false
          # The only paid part (free plans have no background workers). It writes emails to its log and runs reminders and the nightly money check. Delete it to keep everything free.
          - type: worker
            name: tw-worker-test
            runtime: docker
            region: frankfurt
            plan: 0.5c-512mb
            dockerfilePath: ./apps/api/Dockerfile
            dockerContext: .
            dockerCommand: node --enable-source-maps dist/worker.js
            branch: main
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - 'apps/api/**'
                - 'packages/**'
                - 'pnpm-lock.yaml'
                - 'pnpm-workspace.yaml'
                - 'package.json'
            envVars:
              - fromGroup: tw-test-config
              - key: DATABASE_URL
                fromDatabase:
                  name: tw-db-test
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: tw-redis-test
                  property: connectionString
              - key: JWT_PRIVATE_KEY
                sync: false
