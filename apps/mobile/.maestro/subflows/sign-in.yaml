# Signs in from a fresh launch. Params: EMAIL, PASSWORD (passed with -e, never committed).
appId: com.trainingwallet.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 20000
- tapOn:
    id: field-email
- inputText: ${EMAIL}
- tapOn:
    id: field-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
